apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopsphere-production
  namespace: argocd
  labels:
    app.kubernetes.io/name: shopsphere-production
    stage: "stage-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: shopsphere
  source:
    repoURL: "https://github.com/vinodk11/shopsphere-aws-scaling-gitops.git"
    targetRevision: main
    path: environments/production
  destination:
    server: "https://kubernetes.default.svc"
    namespace: shopsphere-stage9
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
